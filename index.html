<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>WMS CD Guarapari</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background:#eef1f5;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

input, select{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-top:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.numero{
    font-size:22px;
    font-weight:bold;
}

.charts{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:20px;
    margin-top:20px;
}

canvas{
    background:white;
    padding:10px;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:white;
}

th, td{
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

th{
    background:#111827;
    color:white;
}

</style>
</head>

<body>

<h1>WMS CD Guarapari - Dashboard Inteligente</h1>

<div class="controls">
    <input type="file" id="arquivo">
    <input type="text" id="busca" placeholder="Buscar...">
</div>

<div class="grid" id="cards"></div>

<div class="charts">
    <canvas id="graficoStatus"></canvas>
    <canvas id="graficoAndar"></canvas>
</div>

<table>
<thead>
<tr>
<th>Local</th>
<th>Bloco</th>
<th>Andar</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<script>

let dados = [];

document.getElementById("arquivo").addEventListener("change", function(e){

    const reader = new FileReader();
    reader.readAsText(e.target.files[0], "ISO-8859-1");

    reader.onload = function(){

        let linhas = reader.result.split(/\r?\n/).filter(l => l.trim() !== "");

        dados = linhas.slice(1).map(l => {

            let c = l.split("\t");

            return {
                local: c[0],
                bloco: c[1],
                andar: c[4],
                ativo: c[10]
            };
        });

        render();
    };
});

function render(){

    let total = dados.length;
    let ativos = dados.filter(d => d.ativo === "S").length;
    let inativos = total - ativos;

    let andares = {
        "1": dados.filter(d => d.andar == "1").length,
        "2": dados.filter(d => d.andar == "2").length,
        "3": dados.filter(d => d.andar == "3").length
    };

    document.getElementById("cards").innerHTML = `
        <div class="card">Total<div class="numero">${total}</div></div>
        <div class="card">Ativos<div class="numero">${ativos}</div></div>
        <div class="card">Inativos<div class="numero">${inativos}</div></div>
    `;

    document.getElementById("tabela").innerHTML = dados.map(d => `
        <tr>
            <td>${d.local}</td>
            <td>${d.bloco}</td>
            <td>${d.andar}</td>
            <td>${d.ativo === "S" ? "ATIVO" : "INATIVO"}</td>
        </tr>
    `).join("");

    // 📊 GRÁFICO 1 - STATUS
    new Chart(document.getElementById("graficoStatus"), {
        type: "pie",
        data: {
            labels: ["Ativos", "Inativos"],
            datasets: [{
                data: [ativos, inativos]
            }]
        }
    });

    // 📊 GRÁFICO 2 - ANDARES
    new Chart(document.getElementById("graficoAndar"), {
        type: "bar",
        data: {
            labels: ["1º Andar", "2º Andar", "3º Andar"],
            datasets: [{
                data: [andares["1"], andares["2"], andares["3"]]
            }]
        }
    });
}

</script>

</body>
</html>
