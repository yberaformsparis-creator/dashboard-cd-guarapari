<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Ocupação GYP</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
font-family:Arial;
padding:20px;
background:#f4f4f4;
}

.card{
background:white;
padding:20px;
margin:10px;
border-radius:10px;
display:inline-block;
width:250px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<h1>Dashboard Ocupação CD Guarapari</h1>

<div class="card">
<h3>Total</h3>
<p id="total"></p>
</div>

<div class="card">
<h3>Ocupados</h3>
<p id="ocupados"></p>
</div>

<div class="card">
<h3>Disponíveis</h3>
<p id="disponiveis"></p>
</div>

<div class="card">
<h3>Bloqueados</h3>
<p id="bloqueados"></p>
</div>

<script>

Papa.parse("enderecos.csv",{
download:true,
header:true,
complete:function(resultado){

let dados = resultado.data;

let total = dados.length;

let ocupados = dados.filter(x =>
Number(x["Estoque"]) > 0
).length;

let disponiveis = dados.filter(x =>
Number(x["Estoque"]) == 0
).length;

let bloqueados = dados.filter(x =>
x["Motivo do Bloqueio"] &&
x["Motivo do Bloqueio"] != ""
).length;

document.getElementById("total").innerHTML = total;
document.getElementById("ocupados").innerHTML = ocupados;
document.getElementById("disponiveis").innerHTML = disponiveis;
document.getElementById("bloqueados").innerHTML = bloqueados;

}
});

</script>

</body>
</html>
