<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>WMS CD Guarapari</title>

<style>
body{
    font-family: Arial;
    background:#eef1f5;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

input, select{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:10px;
    margin-top:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.numero{
    font-size:22px;
    font-weight:bold;
}

.tabela{
    margin-top:20px;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

th{
    background:#111827;
    color:white;
}

.status{
    padding:4px 8px;
    border-radius:10px;
    font-size:12px;
}

.ok{background:#d1fae5;color:#065f46;}
.nok{background:#fee2e2;color:#991b1b;}
</style>
</head>

<body>

<h1>WMS CD Guarapari - Controle Real</h1>

<div class="controls">
    <input type="file" id="arquivo">
    <input type="text" id="busca" placeholder="Buscar Local / Bloco">
    <select id="filtro">
        <option value="todos">Todos</option>
        <option value="ativo">Ativo</option>
        <option value="inativo">Inativo</option>
    </select>
</div>

<div class="grid" id="cards"></div>

<div class="tabela">
<table>
<thead>
<tr>
<th>Local</th>
<th>Bloco</th>
<th>Andar</th>
<th>Estoque</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>
</div>

<script>

let dados = [];

document.getElementById("arquivo").addEventListener("change", function(e){

    const file = e.target.files[0];
    const reader = new FileReader();

    // 🔥 CORREÇÃO DO Ã© Ã§
    reader.readAsText(file, "ISO-8859-1");

    reader.onload = function(){

        let linhas = reader.result.split(/\r?\n/).filter(l => l.trim() !== "");

        let header = linhas[0].split("\t");

        dados = linhas.slice(1).map(linha => {

            let col = linha.split("\t");

            return {
                local: col[0],
                bloco: col[1],
                andar: col[4],
                estoque: col[21],
                ativo: col[10] // S ou N
            };
        });

        render();
    };
});

document.getElementById("busca").addEventListener("input", render);
document.getElementById("filtro").addEventListener("change", render);

function render(){

    let busca = document.getElementById("busca").value.toLowerCase();
    let filtro = document.getElementById("filtro").value;

    let filtrado = dados.filter(d => {

        let okBusca =
            (d.local || "").toLowerCase().includes(busca) ||
            (d.bloco || "").toLowerCase().includes(busca);

        let status = d.ativo === "S" ? "ativo" : "inativo";

        let okFiltro = filtro === "todos" || filtro === status;

        return okBusca && okFiltro;
    });

    let total = dados.length;
    let ativos = dados.filter(d => d.ativo === "S").length;
    let inativos = total - ativos;

    document.getElementById("cards").innerHTML = `
        <div class="card"><div>Total</div><div class="numero">${total}</div></div>
        <div class="card"><div>Ativos</div><div class="numero">${ativos}</div></div>
        <div class="card"><div>Inativos</div><div class="numero">${inativos}</div></div>
    `;

    document.getElementById("tabela").innerHTML = filtrado.map(d => `
        <tr>
            <td>${d.local}</td>
            <td>${d.bloco}</td>
            <td>${d.andar}</td>
            <td>${d.estoque}</td>
            <td>
                <span class="status ${d.ativo === "S" ? "ok" : "nok"}">
                    ${d.ativo === "S" ? "ATIVO" : "INATIVO"}
                </span>
            </td>
        </tr>
    `).join("");
}

</script>

</body>
</html>
